[project]
name = "dagent"
version = "0.1.0"
description = "A durable, async DAG execution engine for multi-agent AI workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "httpx>=0.27",  # AGENTS.md §4: the HTTP client for provider calls (Phase 3)
    "pyyaml>=6.0",  # FR-1 workflow files; see the note in ARCHITECTURE.md §2
    # Observability (Phase 7). The *API* only: OpenTelemetry's API is a no-op until an
    # application installs an SDK, so a library depending on it costs a nearly-free
    # function call and forces nothing on anyone. The SDK and the exporters are the
    # `otel` extra, which is the split OTel itself prescribes for libraries.
    "opentelemetry-api>=1.25",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Postgres is opt-in, not assumed: SPEC's portability requirement is that v1 runs with
# zero external services, so a store nobody asked for must not be able to break an
# in-memory run's import. `dagent/store/postgres.py` is the only module that imports it.
postgres = ["asyncpg>=0.29"]
# Turns the no-op tracer and meter into real ones and exposes a Prometheus endpoint.
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-prometheus>=0.46b0",
]

# Deliberately absent until the phase that calls for them (AGENTS.md §7): redis (Phase 8).
# No model SDK and no orchestration framework will ever appear here outside `agents/`
# — tests/test_isolation.py fails the build if one does.

[project.scripts]
dagent = "dagent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "asyncpg>=0.29",  # so the Postgres store is importable in tests
    "opentelemetry-sdk>=1.25",  # in-memory span and metric readers for the tests
    "opentelemetry-exporter-prometheus>=0.46b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # import sorting
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # simplify
    "C4",    # comprehensions
    "ASYNC", # blocking calls in async code (AGENTS.md §5)
    "RUF",
    "D",     # docstrings on public symbols (AGENTS.md §5)
]
ignore = [
    "D203", # incompatible with D211, which we keep
    "D213", # incompatible with D212, which we keep
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]      # test names are the documentation
"benchmarks/*" = ["D"] # a driver, not library surface

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# asyncpg ships no type information. Scoped to the one third-party package rather than
# loosened globally, and it is not a `type: ignore` on any of our own code.
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["dagent"]
branch = true
